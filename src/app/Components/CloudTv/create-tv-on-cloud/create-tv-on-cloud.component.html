<div class="flex flex-col w-full">
    <div class="w-full flex flex-col gap-10 justify-center items-center">
        <div class="text-orange-500 w-full font-bold font-abcd text-2xl">
            Create TV On Cloud
        </div>

        <div class="flex w-[95%] gap-6 flex-col">
            <div class="w-full flex justify-between items-center flex-row-reverse">
                <button (click)="togglePopup1()" class="bg-[#63040D] text-white px-4 py-2 font-semibold" >
                    Create New TV
                </button>
            
                <div>
                    <label class="text-lg font-semibold text-[#63040D]" for="choice">Select TV Type:</label>
                    <select class="ml-2 p-1" id="choice" name="choice">
                        <option value="d2c">D2C</option>
                        <option value="b2b">B2B</option>
                    </select>
                </div>
            </div>            

            <div class="w-full p-5 bg-white border-[1px] flex flex-col justify-start border-black">
                <div class="h-2 gap-5 flex text-[15px] justify-start font-semibold text-[#63040D] w-full mb-10">
                    <div class="w-[8%] h-10">Serial#</div>
                    <div class="w-[8%] h-10">TV Id</div>
                    <div class="w-[12%] h-10">TV Name</div>
                    <div class="w-[8%] h-10">Geo</div>
                    <div class="w-[8%] h-10">Status</div>
                    <div class="w-[8%] h-10">Published</div>
                    <div class=" flex flex-col w-[45%] h-10">
                        <div class=" w-full flex flex-col justify-center items-center h-5">
                            <div class="w-full h-6 flex flex-col justify-end">
                                <div class="w-full h-1 bg-red-500"></div>
                            </div>
                            <span class="px-2 absolute bg-white z-10">Actions</span>
                            <div class=" w-full flex justify-between h-4">
                                <div class="w-1 h-full bg-red-500"></div>
                                <div class="w-1 h-full bg-red-500"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="w-full flex text-[12px] font-semibold flex-col gap-1">
                    <div class="w-full gap-5 py-2 flex justify-start">
                        <div class="w-[8%] h-8">1</div>
                        <div class="w-[8%] h-8">177</div>
                        <div class="w-[12%] h-8">One Tv One World</div>
                        <div class="w-[8%] h-8">India</div>
                        <div class="w-[8%] h-8">
                            <img [src]="valid" class="h-6 w-auto" />
                        </div>
                        <div class="w-[8%] h-8">
                            <img [src]="valid" class="h-6 w-auto" />
                        </div>

                        <div class="flex w-[45%] justify-between items-center gap-1">
                            <button (click)="togglePopup2()" class=" h-8">
                                <img [src]="edit" alt="Edit" class="h-6 w-auto" />
                            </button>

                            <button class="bg-green-500 text-xs text-white px-2 py-1">
                                Manage Ch on tv
                            </button>

                            <button class="bg-green-500 text-xs text-white px-2 py-1">
                                Manage Ch combos
                            </button>

                            <button class="bg-green-500 text-xs text-white px-2 py-1">
                                Publish TV on cloud
                            </button>

                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- add channel -->
    <div *ngIf="isPopupVisible1" class="fixed z-20 inset-0 flex justify-center items-center bg-black bg-opacity-50">
        <form (ngSubmit)="addChannel()" class="w-[55%] bg-white flex flex-col">
            <div class="w-full px-4 pt-8 items-center flex flex-row-reverse">
                <button (click)="togglePopup1()" class="absolute z-2 bg-transparent text-gray-600 hover:text-red-500 text-2xl font-bold">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div class="w-full  p-5 flex justify-start gap-8">
                <span class="text-lg font-semibold text-[#63040D]">TV type:<span class="ml-2 text-lg text-gray-500"></span></span>            
                <span class="text-lg font-semibold text-[#63040D]">Serial#:<span class="ml-2 text-lg text-gray-500"></span></span>            
            </div>


            <div class="w-full flex rounded-lg mb-5">
                <div class="w-[50%] flex flex-col gap-6 h-full p-5 pr-0">

                    <div>
                        <label class="text-lg font-semibold text-[#63040D]" for="channelName">Name :</label>
                        <input name="channelName" class="ml-2 p-1" type="text" id="channelName" placeholder="" required />
                    </div>

                    <div>
                        <label class="text-lg font-semibold text-[#63040D]" for="valid">Valid:</label>
                        <select name="valid" class="ml-2 p-1" id="valid" required>
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </div>
            
                <div class="w-[50%] flex p-5 pr-0 flex-col h-full">
                    <div>
                        <label class="text-lg font-semibold text-[#63040D]" for="geo">Geo :</label>
                        <input name="geo" class="ml-2 p-1" type="text" id="geo" placeholder="" required />
                    </div>
                </div>
            </div>

            <div class="flex justify-center pb-6 w-full items-center">
                <button class="bg-red-600 px-4 py-2 hover:bg-red-700 text-white font-semibold">Save TV</button>
            </div>
        </form>
    </div>

    <!-- edit channel -->
    <div *ngIf="isPopupVisible2" class="fixed z-20 inset-0 flex justify-center items-center bg-black bg-opacity-50">
        <form (ngSubmit)="editChannel()" class="w-[55%] bg-white flex flex-col">
            <div class="w-full px-4 pt-8 items-center flex flex-row-reverse">
                <button (click)="togglePopup2()" class="absolute z-2 bg-transparent text-gray-600 hover:text-red-500 text-2xl font-bold">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div class="w-full  p-5 flex justify-start gap-8">
                <span class="text-lg font-semibold text-[#63040D]">TV type:<span class="ml-2 text-lg text-gray-500"></span></span>            
                <span class="text-lg font-semibold text-[#63040D]">Serial#:<span class="ml-2 text-lg text-gray-500"></span></span>            
            </div>


            <div class="w-full flex rounded-lg mb-5">
                <div class="w-[50%] flex flex-col gap-6 h-full p-5 pr-0">

                    <div>
                        <label class="text-lg font-semibold text-[#63040D]" for="channelName">Name :</label>
                        <input name="channelName" class="ml-2 p-1" type="text" id="channelName" placeholder="" required />
                    </div>

                    <div>
                        <label class="text-lg font-semibold text-[#63040D]" for="valid">Valid:</label>
                        <select name="valid" class="ml-2 p-1" id="valid" required>
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </div>
            
                <div class="w-[50%] flex p-5 pr-0 flex-col h-full">
                    <div>
                        <label class="text-lg font-semibold text-[#63040D]" for="geo">Geo :</label>
                        <input name="geo" class="ml-2 p-1" type="text" id="geo" placeholder="" required />
                    </div>
                </div>
            </div>

            <div class="flex justify-center pb-6 w-full items-center">
                <button class="bg-red-600 px-4 py-2 hover:bg-red-700 text-white font-semibold">Edit TV</button>
            </div>
        </form>
    </div>


   
</div>
